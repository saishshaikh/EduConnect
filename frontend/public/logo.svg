<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="eduGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="115" fill="url(#eduGrad)" />
  
  <!-- Graduation Cap -->
  <g filter="url(#glow)">
    <!-- Cap Diamond Top -->
    <polygon points="256,110 420,185 256,260 92,185" fill="#FFFFFF" />
    <!-- Cap Base Arc -->
    <path d="M165,225 C165,225 190,305 256,305 C322,305 347,225 347,225 C347,225 320,285 256,285 C192,285 165,225 165,225 Z" fill="#FFFFFF" />
    <!-- Tassel -->
    <path d="M400,195 L400,280" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
    <circle cx="400" cy="290" r="14" fill="#FFFFFF" />
    
    <!-- Connection Nodes & Network (EduConnect) -->
    <line x1="256" y1="305" x2="256" y2="380" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
    <line x1="160" y1="375" x2="256" y2="380" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
    <line x1="352" y1="375" x2="256" y2="380" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
    
    <circle cx="256" cy="380" r="26" fill="#FFFFFF" />
    <circle cx="160" cy="375" r="20" fill="#FFFFFF" />
    <circle cx="352" cy="375" r="20" fill="#FFFFFF" />
    <circle cx="256" cy="380" r="12" fill="#3B82F6" />
    <circle cx="160" cy="375" r="9" fill="#3B82F6" />
    <circle cx="352" cy="375" r="9" fill="#3B82F6" />
  </g>
</svg>
